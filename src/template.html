<main class="app" id="app">
  <section class="stage" id="stage">
    <canvas id="board"></canvas>

    <!-- 关卡信息牌:常驻显示 当前关卡 · 难度 · 楼内进度 -->
    <div class="stage-plate" id="stage-plate" hidden>
      <b id="stage-plate-title">—</b>
      <i class="stage-plate__diff" id="stage-plate-diff"></i>
      <span class="stage-plate__progress" id="stage-plate-progress"></span>
    </div>
    <div class="boss-bar" id="boss-bar" hidden>
      <span class="boss-bar__label">镇站巨楼</span>
      <i class="boss-bar__track"><b id="boss-fill"></b></i>
    </div>
    <div class="banner" id="banner" hidden>
      <b id="banner-title"></b>
      <span id="banner-sub"></span>
    </div>
    <div class="danger" id="danger" hidden>楼要压下来了！</div>
    <p class="notice" id="notice"></p>
    <div class="overlay" id="overlay" hidden></div>

    <!-- Floating HUD: resource chips (top-left) + circular actions (top-right).
         Placed after #overlay so the sibling rule below can tuck the chips
         away while a scene panel is open (they would cover its back button). -->
    <div class="hud-top" id="hud-top">
      <div class="hud-chips">
        <div class="hud-chip hud-chip--tower" title="最高楼栋">
          <span class="hud-chip__ico" data-icon="tower"></span>
          <b id="hud-tower">—</b>
        </div>
        <div class="hud-chip hud-chip--heat" title="热度">
          <span class="hud-chip__ico" data-icon="flame"></span>
          <b id="hud-score">0</b>
        </div>
        <div class="hud-chip hud-chip--gem" title="灵石">
          <span class="hud-chip__ico" data-icon="gem"></span>
          <b id="hud-coins">0</b>
        </div>
        <div class="hud-chip hud-chip--shield" title="护盾">
          <span class="hud-chip__ico" data-icon="shield"></span>
          <b id="hud-shield">—</b>
        </div>
        <div class="hud-chip hud-chip--power" title="战力">
          <span class="hud-chip__ico" data-icon="critPower"></span>
          <b id="hud-power">0</b>
        </div>
        <span class="save-led" id="save-led" title="进度已保存"></span>
      </div>
      <div class="hud-actions">
        <button id="pause" class="fab" data-label="暂停" aria-label="暂停" hidden></button>
      </div>
    </div>

    <!-- In-run build shortcut: bottom-right circular button with skill count. -->
    <button id="build-fab" class="fab fab--build" aria-label="构筑" hidden>
      <span class="fab__badge" id="build-fab-badge">0</span>
    </button>
  </section>

  <aside class="side-panel" id="side-panel">
    <h2 class="side-panel__title">作战面板</h2>
    <div class="side-panel__tower" id="side-tower"></div>
    <div class="side-panel__sub">构筑</div>
    <div class="build-list" id="build-list"></div>
    <div class="side-panel__sub">遗物</div>
    <div class="relic-list" id="relic-list"></div>
    <div class="side-panel__sub">砖块图例</div>
    <div class="side-panel__legend" id="side-legend"></div>
    <div class="side-panel__foot">空格/回车发射 · ←→ 瞄准 · Esc/P 暂停</div>
    <p class="player" id="player"></p>
  </aside>
</main>
