# 手动部署 Pages:不发版,把当前构建发布到线上(应急修复/预览用)。
#
# 触发纪律:纯 push 不触发,只有仓库写权限的人手动点按钮才跑。
# 发版请走 release.yml(推 v* tag,一次完成部署+发版)。
name: Deploy Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 锁死与本地一致的版本,保证 CI 与本地行为可复现
          bun-version: 1.4.4

      - name: 安装依赖(锁定 lockfile)
        run: bun install --frozen-lockfile

      - name: 门禁(typecheck + arch + 单测)
        run: bun run typecheck && bun run arch && bun test test

      - name: 构建 H5
        run: bun run build:h5

      - name: 校验产物完整
        run: |
          test -f dist/web/index.html
          test -f dist/web/app.js
          test -f dist/web/app.css
          ! grep -qE 'src="/|href="/' dist/web/index.html

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - id: deployment
        uses: actions/deploy-pages@v4
